group = "de.freese"
version = "1.0-SNAPSHOT"
description = "Log4J3 Demo."

####################################################################################################

# The default is -Xmx512m "-XX:MaxMetaspaceSize=256m"
#-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=5005
org.gradle.jvmargs = -Xmx1024m -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
file.encoding = UTF-8

org.gradle.configuration-cache = true
org.gradle.configuration-cache.problems = WARN

# all,fail,summary,none
org.gradle.warning.mode = all

####################################################################################################

#G:A org.apache.logging.log4j:log4j-bom
version_log4j = 3.0.0-beta3
