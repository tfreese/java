# Addressbook - Testkonfiguration (isolierte H2-Testdatenbank)
# Siehe plan.md (Testing) und tasks.md T005/T013

logging.level.de.addressbook = DEBUG

spring.datasource.url = jdbc:h2:mem:addressbook-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = ${DB_PASSWORD:}

spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:schema.sql

spring.h2.console.enabled = false
