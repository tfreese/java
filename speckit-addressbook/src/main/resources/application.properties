# Addressbook - application.properties
# Siehe .specify/memory/tech-stack.md und plan.md (Technical Context)

logging.level.de.addressbook = DEBUG

spring.application.name = addressbook
server.port = 8080
server.servlet.context-path = /
spring.web.error.whitelabel.enabled = false

# Embedded H2, Schema aus schema.sql (siehe data-model.md, T004)
spring.datasource.url = jdbc:h2:mem:addressbook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = ${DB_PASSWORD:}

# H2-Console (Debugging)
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console
spring.h2.console.settings.web-allow-others = false

# schema.sql wird bei jedem Start ausgefuehrt (DROP/CREATE)
spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:schema.sql

# spring-boot-devtools (siehe build.gradle.kts, developmentOnly-Dependency):
# XHTML-Aenderungen sollen KEINEN automatischen Anwendungs-Neustart ausloesen
# (unnoetig, da obiger Facelets-Refresh das bereits ohne Neustart abdeckt) -
# nur ein LiveReload-Browser-Refresh ist gewuenscht. Java-Code-Aenderungen
# (Backing-Beans, Services) loesen weiterhin den schnellen DevTools-Neustart aus.
spring.devtools.restart.exclude = **/*.xhtml, META-INF/**

# Entwicklung: JSF/Facelets-Views (*.xhtml) NICHT cachen, damit Aenderungen
# ohne Neustart der Anwendung sichtbar sind - ein einfaches Browser-Reload
# genuegt, da Mojarra/MyFaces die Seite bei jedem Request neu vom Dateisystem/
# Klassenpfad einliest und neu kompiliert (siehe joinfaces JakartaFaces3Properties).
# facelets-refresh-period=0: Aenderung wird bei JEDEM Request geprueft
# (kein Zeitintervall-Cache). NUR fuer lokale Entwicklung - in Produktion
# ProjectStage=Production verwenden (bessere Performance durch View-Caching).
joinfaces.faces.project-stage = Development
joinfaces.faces.facelets-refresh-period = 0
