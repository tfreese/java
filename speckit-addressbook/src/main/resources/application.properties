# Addressbook - application.properties
# Siehe .specify/memory/tech-stack.md und plan.md (Technical Context)

logging.level.de.addressbook = DEBUG

spring.application.name = addressbook
server.port = 8080
server.servlet.context-path = /

# Embedded H2, Schema aus schema.sql (siehe data-model.md, T004)
spring.datasource.url = jdbc:h2:mem:addressbook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = ${DB_PASSWORD:}

# H2-Console (Debugging)
spring.h2.console.enabled = false
spring.h2.console.path = /h2-console
spring.h2.console.settings.web-allow-others = false

# schema.sql wird bei jedem Start ausgefuehrt (DROP/CREATE)
spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:schema.sql
